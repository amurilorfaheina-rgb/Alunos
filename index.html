<style>
:root{--bg:#fbf5e6;--card:#fffaf0;--ink:#2b3a4f;--mut:#6b7a8f;--blue:#7fa8d1;--blue-d:#4f7fae;--line:#e6dcc3;--top:#f2e6c8;--ok:#4f9a78;--bad:#c9675f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:16px}

.top .nota{font-size:34px;font-weight:700;margin:4px 0 0;color:var(--blue-d)}.top small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
h2{font-size:16px;margin:0 0 8px}
input,button,select{font:inherit;color:var(--ink)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px;min-width:0}
button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--blue-d);border:1px solid var(--blue)}
button.x{background:transparent;color:var(--bad);padding:2px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input{flex:1}
.stu{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.stu:last-child{border:0}.pill{background:var(--blue);color:#fff;border-radius:99px;padding:2px 10px;font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut);font-size:13px}
.hist{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.chart{overflow-x:auto}
body{font-size:15px;-webkit-font-smoothing:antialiased}
.wrap{padding:14px 14px 40px}
.top{box-shadow:0 4px 14px rgba(79,127,174,.14);padding:14px 16px 12px}
.top #tt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.top .nota{display:inline-block;margin:6px 0 2px;padding:0 24px;border-radius:99px;background:var(--blue);color:#fff;font-size:36px;line-height:1.3}
.card{border-radius:20px;padding:16px;box-shadow:0 2px 10px rgba(120,100,60,.09);animation:up .25s ease both}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:17px;margin:0 0 12px;font-weight:650}
button{min-height:42px;font-weight:600;transition:transform .1s,filter .15s;box-shadow:0 1px 2px rgba(0,0,0,.08)}
button:active{transform:scale(.97)}button:hover{filter:brightness(1.06)}
button.ghost,button.x{box-shadow:none}
input,select{min-height:42px;border-radius:12px;font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue-d);outline-offset:1px}
.row>input{min-width:110px}
.stu{border:0;border-radius:14px;padding:10px 12px;margin:0 0 8px;background:var(--bg);gap:12px;justify-content:flex-start}
.stu:active{transform:scale(.99)}
.av{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.nm{flex:1;font-weight:600}
.pill{min-width:48px;text-align:center;font-weight:700;padding:4px 10px}
.pill.g{background:var(--ok)}.pill.y{background:#d9a441}.pill.r{background:var(--bad)}
.tabs{gap:8px;padding:2px 0 6px;scrollbar-width:none}

.stat{padding:14px 8px;border:1px solid var(--line)}.stat b{font-size:26px}
.hist{padding:10px 2px}
body{line-height:1.55;letter-spacing:0;word-spacing:normal;text-align:left;overflow-wrap:anywhere}
h2{line-height:1.35;margin:0 0 12px}
.card>.mut{margin-top:6px;line-height:1.5}
.card>h2+.mut{margin-top:-6px;margin-bottom:10px}
.mut{font-size:13px;line-height:1.5}
.top #tt{letter-spacing:.04em;line-height:1.3}
.top small{display:block;margin-top:2px;line-height:1.4;font-size:12px}
.stat span{display:block;margin-top:4px;line-height:1.35;font-size:12px}
.stat b{line-height:1.2}
.grid{gap:10px}
.hist{gap:12px;line-height:1.55;align-items:center}
.hist>div{line-height:1.6}
.hist .mut{display:inline-block;margin:2px 0}
.row{gap:10px}
.row>input{flex:1 1 130px;min-width:0;font-size:15px}
.row>select{flex:1 1 100%}
.tabs button{line-height:1.2;white-space:nowrap}
.pill{line-height:1.4}
.nm{line-height:1.3}
.top{padding-left:56px;padding-right:56px}
#mb{position:absolute;right:10px;top:10px;width:44px;padding:0;display:grid;place-items:center;background:transparent;color:var(--ink);box-shadow:none}
#menu{position:absolute;right:12px;top:58px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;min-width:200px;z-index:20;text-align:left}
#menu[hidden]{display:none}
#menu button{display:block;width:100%;background:transparent;color:var(--ink);text-align:left;box-shadow:none;border-radius:10px}
#menu button:hover{background:var(--bg)}
.upl{background:var(--blue);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;display:inline-block;cursor:pointer;text-align:center;flex:1 1 100%}
.upl:active{transform:scale(.98)}
html{-webkit-text-size-adjust:100%}button,.stu{-webkit-tap-highlight-color:transparent}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.card{animation:none}
#app.go>.card{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#app.go .fill{transform-origin:left;animation:grow .8s .2s cubic-bezier(.2,.8,.2,1) both}

#app.go .chart path[stroke-width="2.5"]{stroke-dasharray:1;animation:draw .9s .25s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
#app.go .chart circle,#app.go .chart text,#app.go .chart rect{animation:fade .5s .7s both}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
#app.go .tabs button.on{animation:pop .35s ease}

.av .ic{width:20px;height:20px}
#menu button{display:flex;align-items:center;gap:10px}
.hist>.ed{margin-left:auto}
/* ---- melhorias de interface ---- */
#mb,#menu{display:none!important}
.top{padding-left:16px;padding-right:16px}
.wrap{padding-bottom:104px}
#bn{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;background:var(--card);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 14px rgba(0,0,0,.06)}
#bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;color:var(--mut);box-shadow:none;font-size:12px;min-height:50px;border-radius:14px;padding:6px}
#bn button.on{color:var(--blue-d);background:var(--bg)}
#bn svg{width:22px;height:22px}
h2{position:relative;padding-left:12px}
h2::before{content:"";position:absolute;left:0;top:.18em;bottom:.18em;width:4px;border-radius:4px;background:var(--blue)}
.tp{display:inline-block;font-size:11px;font-weight:700;padding:1px 9px;border-radius:99px;margin-top:3px;line-height:1.5}
.tp1{background:rgba(127,168,209,.25);color:var(--blue-d)}
.tp2{background:rgba(217,164,65,.25);color:#c58b1f}
.tp3{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.empty{text-align:center;padding:22px 12px;color:var(--mut);line-height:1.6;border:2px dashed var(--line);border-radius:16px}
.empty b{color:var(--ink);font-size:16px}
.stu{border:1px solid var(--line);transition:background .15s,transform .1s}
.stu:hover{background:var(--top)}
.stat:nth-child(1){border-top:3px solid var(--ok)}
.stat:nth-child(2),.stat:nth-child(3){border-top:3px solid var(--bad)}
.stat:nth-child(4){border-top:3px solid var(--blue)}
.tabs{scroll-snap-type:x proximity}.tabs button{scroll-snap-align:center}
.hist{border-bottom:1px solid var(--line);border-radius:8px}
.hist:last-child{border-bottom:0}
.hist:hover{background:var(--bg)}
.card .fill{transition:width .5s ease}
.top{backdrop-filter:blur(8px)}
</style>
</head>
<body>
<div class="top"><button id="mb" aria-label="Menu" onclick="toggleMenu(event)"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M3 6h16M3 11h16M3 16h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button><div id="menu" hidden><button onclick="goHome()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14a6.5 6.5 0 0 1 3 6"/></svg>Alunos</button><button onclick="goOrg()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Organização</button></div><div id="tt">Desempenho dos Alunos</div><div class="nota" id="tn"></div><small id="ts"></small></div>
<div class="wrap" id="app"></div>
<nav id="bn"><button data-k="a" onclick="goHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14a6.5 6.5 0 0 1 3 6"/></svg>Alunos</button><button data-k="o" onclick="goOrg()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Organização</button></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var KEY="desempenho_v1",SUBJ_KEY="desempenho_subj";
var S={students:[],subjects:["Matemática","Português","Ciências","História","Geografia","Inglês"]};
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
migrate();
var cur=null,tab=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function fmtD(d){var p=d.split("-");return p[2]+"/"+p[1]}
function data(st,sj,et){et=et||etapa;st.et=st.et||{};var b=st.et[et]=st.et[et]||{};var o=b[sj]=b[sj]||{daily:[],quiz:[]};o.topics=o.topics||[];o.provas=o.provas||[];return o}
function stats(st,sj,sub,et){var d=data(st,sj,et),a=0,e=0,qt=0,qe=0,qg=0,ok=function(x){return sub==null||(x.sub||"")===sub};
 d.daily.forEach(function(x){if(ok(x)){a+=x.a;e+=x.e}});d.quiz.forEach(function(x){if(ok(x)){var p=qpts(x);qt+=p.max;qg+=p.got;qe+=p.err}});
 var ac=a+qg,tot=a+e+qt;
 return{a:a,e:e,qt:qt,qe:qe,tot:tot,nota:comb(a,e,qg,qt,sub==null?pm(d):null),qpct:qt?(qt-qg)/qt*100:null}}
function overall(st,et){var s=0,n=0;(et?[et]:ETAPAS).forEach(function(e){S.subjects.forEach(function(sj){var x=stats(st,sj,undefined,e);if(x.nota!=null){s+=x.nota;n++}})});return n?s/n:null}
var edit=null,flt="todos";
function comb(a,e,qg,qt,np){var P=S.pesos||{prova:50,quiz:30,dia:20},t=0,w=0;[[a+e?a/(a+e)*10:null,P.dia],[qt?qg/qt*10:null,P.quiz],[np,P.prova]].forEach(function(x){if(x[0]!=null&&x[1]>0){t+=x[0]*x[1];w+=x[1]}});return w?t/w:null}
function hue(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h}
function setNav(k){var b=document.getElementById("bn");if(!b)return;[].forEach.call(b.children,function(x){x.classList.toggle("on",x.dataset.k===k)})}
function TN(t){return t==="particular"?"Particular":t==="reforco"?"Reforço":"Sem tipo"}
function cnt(t){return S.students.filter(function(s){return s.tipo===t}).length}
function fltBar(){return'<div class="tabs" style="margin-bottom:8px">'+[["todos","Todos ("+S.students.length+")"],["reforco","Reforço ("+cnt("reforco")+")"],["particular","Particulares ("+cnt("particular")+")"]].map(function(x){return'<button class="'+(flt===x[0]?"on":"")+'" data-f="'+x[0]+'" onclick="setFlt(this.dataset.f)">'+x[1]+'</button>'}).join("")+'</div>'}
function setFlt(v){flt=v;list()}
function tipoSel(st){return'<div class="row" style="margin-bottom:8px"><span class="mut">Tipo de aluno:</span><select id="tp" onchange="setTipo(this.value)" style="flex:1 1 140px">'+[["","Não definido"],["reforco","Reforço"],["particular","Particular"]].map(function(o){return'<option value="'+o[0]+'"'+((st.tipo||"")===o[0]?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select></div>'}
function setTipo(v){getSt().tipo=v;save();view()}
function pesosCard(){var p=S.pesos;return'<div class="card"><h2>Pesos da nota</h2><div class="mut">Cada matéria combina provas, quizzes e questões do dia. Se um deles não tiver registro, os pesos restantes são reajustados.</div><div class="row" style="margin-top:8px"><label class="mut" style="flex:1 1 90px">Provas %<input type="number" min="0" max="100" id="pw1" value="'+p.prova+'" style="width:100%"></label><label class="mut" style="flex:1 1 90px">Quizzes %<input type="number" min="0" max="100" id="pw2" value="'+p.quiz+'" style="width:100%"></label><label class="mut" style="flex:1 1 90px">Dia a dia %<input type="number" min="0" max="100" id="pw3" value="'+p.dia+'" style="width:100%"></label></div><div class="row" style="margin-top:8px"><button onclick="savePesos()">Salvar pesos</button></div><div class="mut" id="pwm" style="margin-top:6px"></div></div>'}
function savePesos(){var g=function(i){return parseFloat(document.getElementById(i).value)||0},a=g("pw1"),b=g("pw2"),c=g("pw3"),m=document.getElementById("pwm");if(a<0||b<0||c<0||Math.round(a+b+c)!==100){m.textContent="A soma precisa ser 100 (atual: "+(a+b+c)+").";return}S.pesos={prova:a,quiz:b,dia:c};save();list();document.getElementById("pwm").textContent="Pesos salvos."}
function bkWarn(){if(!S.students.length)return"";var t=S.lastBackup,d=t?Math.floor((Date.now()-t)/864e5):null;if(d!=null&&d<14)return"";return'<div class="card" style="border-color:var(--bad)"><b>Backup pendente</b><div class="mut">'+(d==null?"Você ainda não fez nenhum backup.":"Último backup há "+d+" dias.")+' Se os dados do navegador forem apagados, tudo se perde.</div><button style="margin-top:8px" onclick="backup()">Salvar backup agora</button></div>'}
async function saveFile(name,data){var dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use("downloads")}catch(e){}if(dl){await dl.save({filename:name,data:data});return}var b=data instanceof Blob?data:new Blob([data]),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}
function ed(k,id){edit={k:k,id:id};view();var e=document.getElementById("edc");if(e)e.scrollIntoView({behavior:"smooth",block:"center"})}
function cancelEd(){edit=null;view()}
function editCard(d){if(!edit)return"";var r=(d[edit.k]||[]).filter(function(x){return x.id===edit.id})[0];if(!r)return"";var h='<div class="card" id="edc" style="border-color:var(--blue-d)"><h2>Editar registro</h2>';
if(edit.k==="quiz"&&r.ef===undefined)return h+'<div class="mut">Registro antigo, sem divisão por nível: exclua e refaça.</div><div class="row" style="margin-top:8px"><button class="ghost" onclick="cancelEd()">Fechar</button></div></div>';
h+='<div class="row">';
if(edit.k==="daily")h+='<input type="date" id="e1" value="'+r.d+'"><input type="number" min="0" id="e2" value="'+r.a+'" placeholder="Acertos"><input type="number" min="0" id="e3" value="'+r.e+'" placeholder="Erros">';
else if(edit.k==="quiz")h+='<input type="date" id="e1" value="'+r.d+'"><input type="number" min="0" max="6" id="e2" value="'+(6-r.ef)+'" placeholder="Fáceis certas (0-6)"><input type="number" min="0" max="4" id="e3" value="'+(4-r.em)+'" placeholder="Médias certas (0-4)"><input type="number" min="0" max="2" id="e4" value="'+(2-r.ed)+'" placeholder="Difíceis certas (0-2)">';
else h+='<input id="e1" value="'+esc(r.nome||"")+'" placeholder="Nome"><input type="date" id="e2" value="'+r.d+'"><input type="number" step="0.1" min="0" max="10" id="e3" value="'+r.n+'" placeholder="Nota (0-10)">';
return h+'</div><div class="row" style="margin-top:8px"><button onclick="saveEd()">Salvar alterações</button><button class="ghost" onclick="cancelEd()">Cancelar</button></div></div>'}
function saveEd(){var d=data(getSt(),tab),r=d[edit.k].filter(function(x){return x.id===edit.id})[0],v=function(i){return document.getElementById(i).value};if(!r)return cancelEd();
if(edit.k==="daily"){var a=parseInt(v("e2"))||0,e=parseInt(v("e3"))||0;if(!v("e1")||a+e<1)return;r.d=v("e1");r.a=a;r.e=e}
else if(edit.k==="quiz"){var f=parseInt(v("e2")),m=parseInt(v("e3")),z=parseInt(v("e4"));if(!v("e1")||isNaN(f)||isNaN(m)||isNaN(z)||f<0||f>6||m<0||m>4||z<0||z>2)return;r.d=v("e1");r.ef=6-f;r.em=4-m;r.ed=2-z}
else{var n=parseFloat(v("e3"));if(isNaN(n)||n<0||n>10||!v("e2"))return;r.nome=v("e1").trim();r.d=v("e2");r.n=n}
edit=null;save();view()}
